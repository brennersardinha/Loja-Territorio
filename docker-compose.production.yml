# Produção: PostgreSQL + API + vitrine (nginx). Variáveis em .env.production (veja .env.production.example).
# Primeira execução: docker compose -f docker-compose.production.yml --env-file .env.production run --rm backend npm run migrate
#                    docker compose -f docker-compose.production.yml --env-file .env.production run --rm backend npm run seed
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB obrigatorio}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB obrigatorio}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatorio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatorio}
      STORE_PUBLIC_URL: ${STORE_PUBLIC_URL:?STORE_PUBLIC_URL obrigatorio}
      CORS_ORIGIN: ${STORE_PUBLIC_URL:?STORE_PUBLIC_URL obrigatorio}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?TRUSTED_PROXY_CIDRS obrigatorio}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      MELHOR_ENVIO_TOKEN: ${MELHOR_ENVIO_TOKEN:-}
      SHIPPING_ORIGIN_ZIP: ${SHIPPING_ORIGIN_ZIP:?SHIPPING_ORIGIN_ZIP obrigatorio}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      STORE_NAME: ${STORE_NAME:-Minha Loja}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
