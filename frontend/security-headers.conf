# Incluido em cada bloco que define add_header: no nginx, um add_header dentro de
# location descarta os cabecalhos herdados do server.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Libera somente fontes do Google, os rastreadores (GA4/GTM/Meta) carregados apos consentimento e o Stripe.js.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; img-src 'self' data: https:; script-src 'self' https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; frame-src https://js.stripe.com https://hooks.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https:" always;
