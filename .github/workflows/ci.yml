name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: loja_test
          POSTGRES_USER: loja_test
          POSTGRES_PASSWORD: loja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loja_test -d loja_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: loja_test
      DB_USER: loja_test
      DB_PASSWORD: loja_test
      JWT_SECRET: ci-secret-with-at-least-32-characters
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Audit production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Check syntax
        working-directory: backend
        shell: bash
        run: find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Apply migrations and seed
        working-directory: backend
        env:
          SEED_ADMIN_EMAIL: admin@example.test
          SEED_ADMIN_PASSWORD: ci-admin-password-123
          SEED_DEMO: 'true'
        run: npm run migrate && npm run migrate:status && npm run seed && npm run seed
      - name: Test migrations on an empty database
        working-directory: backend
        run: npm run test:migrations
      - name: Unit tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  containers:
    name: Containers
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t loja-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t loja-frontend:ci ./frontend
